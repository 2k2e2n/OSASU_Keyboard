# .github/workflows/kicad-diff.yml
name: KiCad visual diff
on:
  push:
    branches: ["master"]
    paths: ["PCB/**/*.kicad_pcb", "PCB/**/*.kicad_sch"]
  pull_request:
    paths: ["PCB/**/*.kicad_pcb", "PCB/**/*.kicad_sch"]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - uses: sksat/kicadiff@v0.2.0
        id: kicadiff
        with:
          path: PCB
          upload-artifact: 'true'
          pr-comment: 'true'
          pr-description: 'true'

      # kicadiffのHTMLビューアを index.html としてPages公開用に配置
      - name: Prepare Pages content
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          OUT_DIR: ${{ steps.kicadiff.outputs.output-dir }}
        run: |
          set -eu
          mkdir -p pages-out
          cp "$OUT_DIR"/*.html pages-out/index.html
          cp -r "$OUT_DIR"/before "$OUT_DIR"/after pages-out/ 2>/dev/null || true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      # READMEにPagesへのリンクを挿入
      - name: Update README with viewer link
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          SECTION="$(mktemp)"
          {
            echo '<!-- kicadiff:viewer:start -->'
            echo "## 🔍 [View interactive PCB/schematic diff](${PAGE_URL})"
            echo '<!-- kicadiff:viewer:end -->'
          } > "$SECTION"

          SECTION_PATH="$SECTION" python3 - <<'PY'
          import os, re
          with open(os.environ["SECTION_PATH"]) as f:
              new_section = f.read().rstrip("\n")
          try:
              with open("README.md") as f:
                  current = f.read()
          except FileNotFoundError:
              current = ""
          pattern = re.compile(
              r"^<!-- kicadiff:viewer:start -->.*?^<!-- kicadiff:viewer:end -->",
              re.DOTALL | re.MULTILINE,
          )
          out = pattern.sub(new_section, current) if pattern.search(current) \
              else current + ("\n\n" if current.strip() else "") + new_section + "\n"
          with open("README.md", "w") as f:
              f.write(out)
          PY

      - name: Commit and push README
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md
          git diff --cached --quiet || git commit -m "chore(kicadiff): update viewer link"
          git push