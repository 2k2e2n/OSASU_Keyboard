name: KiCad CI

permissions:
  contents: read

on:
  push:
    paths:
      - "**/*.kicad_pcb"
      - "**/*.kicad_sch"
      - "libs/**"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kicad/kicad:nightly
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find KiCad source files
        shell: bash
        run: |
          set -euo pipefail

          SCH_NAME=$(find . -type f -name "*.kicad_sch" ! -name "~*" | sort | sed -n '1p')
          PCB_NAME=$(find . -type f -name "*.kicad_pcb" ! -name "~*" | sort | sed -n '1p')

          if [[ -z "${SCH_NAME}" || -z "${PCB_NAME}" ]]; then
            echo "KiCad source files not found"
            exit 1
          fi

          echo "SCH_NAME=${SCH_NAME}" >> "$GITHUB_ENV"
          echo "PCB_NAME=${PCB_NAME}" >> "$GITHUB_ENV"

          echo "Using schematic: ${SCH_NAME}"
          echo "Using pcb: ${PCB_NAME}"

      - name: Export schematic PDF
        shell: bash
        run: |
          set -euo pipefail
          kicad-cli version
          sch_dir="$(dirname "${SCH_NAME}")"
          sch_file="$(basename "${SCH_NAME}")"
          (
            cd "${sch_dir}"
            kicad-cli sch export pdf --output schematic.pdf "${sch_file}"
          )
          cp -f "${sch_dir}/schematic.pdf" ./schematic.pdf
          ls -l schematic.pdf

      - name: Install KiBot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages kibot

      - name: Build BOM and 3D outputs with KiBot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f kibot.yaml ]]; then
            echo "kibot.yaml not found in repository root"
            exit 1
          fi

          kibot --version

          kibot -c kibot.yaml \
            -e "${SCH_NAME}" \
            -b "${PCB_NAME}" \
            generic_bom_csv \
            basic_export_3d_step \
            basic_render_3d_top \
            basic_render_3d_bottom
            